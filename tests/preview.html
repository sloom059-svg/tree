<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة اختبار — بيانات وهمية</title><style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font:12px system-ui,sans-serif}.test-banner{background:#fff4d8;color:#705b20;text-align:center;padding:7px}iframe{flex:1;width:100%;border:0}</style></head><body><div class="test-banner">معاينة اختبار فقط — أسماء وطلب وهمي واحد. لا تتصل بقاعدة البيانات ولا تحفظ أي تغييرات.</div><iframe id="preview" title="اختبار واجهة الشجرة ببيانات وهمية" sandbox="allow-scripts allow-modals allow-downloads"></iframe><script>
(async()=>{
  const html=await (await fetch('../index.html',{cache:'no-store'})).text();
  const bootstrap=()=>{
    const data={tree_session:JSON.stringify({access_token:'demo-not-a-real-session'})};
    Object.defineProperty(window,'sessionStorage',{value:{getItem:key=>data[key]??null,setItem:(key,value)=>{data[key]=String(value);},removeItem:key=>{delete data[key];}}});
    const demoPeople=[
      {id:'demo-root',name:'عبدالله تجريبي',parent_id:null},
      {id:'demo-1',name:'محمد تجريبي',parent_id:'demo-root'},
      {id:'demo-2',name:'أحمد تجريبي',parent_id:'demo-root'},
      {id:'demo-3',name:'خالد تجريبي',parent_id:'demo-root'},
      {id:'demo-4',name:'فهد تجريبي',parent_id:'demo-1'},
      {id:'demo-5',name:'سعد تجريبي',parent_id:'demo-1'},
      {id:'demo-6',name:'ناصر تجريبي',parent_id:'demo-2'},
      {id:'demo-7',name:'علي تجريبي',parent_id:'demo-3'},
      {id:'demo-8',name:'يوسف تجريبي',parent_id:'demo-3'}
    ].map((p,i)=>({...p,gender:'male',sort_order:i}));
    const demoRequest={id:'demo-request',sender_name:'طلب تجريبي',phone:'بيانات اختبار',selected_parent:'demo-root',context:'',details:'طلب وهمي للتحقق من العداد',proposed_names:['اسم تجريبي'],status:'pending',created_at:'2026-10-28T00:00:00+03:00'};
    window.fetch=async(url,options={})=>{
      let result,status=200;
      const path=String(url);
      if(path.includes('/rpc/my_family_invite'))result='demo-not-a-real-invite';
      else if(path.includes('/rpc/family_get_auto_add'))result=false;
      else if(path.includes('/family_people?')&&(!options.method||options.method==='GET'))result=demoPeople;
      else if(path.includes('/family_requests?')&&(!options.method||options.method==='GET'))result=[demoRequest];
      else{status=403;result={message:'هذه معاينة فقط. الحفظ معطل.'};}
      return new Response(JSON.stringify(result),{status,headers:{'Content-Type':'application/json'}});
    };
  };
  const base=new URL('../',location.href).href;
  const patched=html.replace('<head>','<head><base href="'+base+'">').replace('<script src="app.js"><'+'/script>','<script>('+bootstrap.toString()+')();<'+'/script><script src="app.js"><'+'/script>');
  document.querySelector('#preview').srcdoc=patched;
})();
</script></body></html>
